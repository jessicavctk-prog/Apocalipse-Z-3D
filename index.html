<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0f12">
<title>Z-Parkour 3D</title>
<style>
:root{--bg:#0d0f12;--fg:#f2f2f2;--ac:#c0392b;--panel:#141211f5;--slot:#221c19;--slot-b:#4a3b32;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;touch-action:none}
button{font:700 13px system-ui;padding:11px 18px;border:2px solid var(--ac);background:#161010dd;color:var(--fg);border-radius:10px;cursor:pointer;touch-action:manipulation;pointer-events:auto}
button:active{transform:scale(.95)}

/* HUD durante o jogo */
#hud{position:fixed;left:12px;top:calc(10px + env(safe-area-inset-top,0px));font-weight:700;font-size:13px;text-shadow:0 2px 4px #000;pointer-events:none;z-index:10;max-width:58vw;display:none}
.bar{width:172px;height:10px;background:#000a;margin-bottom:5px;border-radius:4px;overflow:hidden;border:1px solid #fff3}.bar i{display:block;height:100%;border-radius:3px;transition:width .1s}
#zoneBadge{display:inline-block;background:#0009;border:1px solid #c0392b99;padding:3px 9px;border-radius:5px;font-size:11px;color:#ffb09e;margin-bottom:5px}
#quickSlots{display:flex;gap:5px;margin-top:6px;pointer-events:auto}
.qSlot{width:42px;height:42px;background:#1a1513d9;border:1.5px solid #6a5244;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 2px 6px #000a;touch-action:manipulation}
.qSlot:active{transform:scale(.94)}
.qSlot img{width:28px;height:28px;object-fit:contain;pointer-events:none}
.qSlot span{position:absolute;right:3px;bottom:1px;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.qSlot small{position:absolute;left:3px;top:1px;font-size:9px;color:#ffd27d;pointer-events:none}

/* Botão de Configurações no canto superior direito (sempre acessível) */
#cfgBtn{position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top,0px));width:48px;height:48px;min-width:0;padding:0;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;background:#181212e6;border:2px solid #e44332;box-shadow:0 4px 14px #000b;z-index:120}

/* Painel de Configurações (Gráficos, Sensibilidade, Horário) */
#cfgPanel{position:fixed;inset:0;display:none;background:#0b0a0aeb;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;z-index:130;overflow-y:auto}
.cfgBox{background:#181413;border:2px solid #5c3b32;border-radius:14px;padding:16px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px #000c}
.cfgBox h2{margin:0;color:#ff6b57;font-size:20px;text-align:center;letter-spacing:1.5px}
.cfgRow{display:flex;flex-direction:column;gap:6px;background:#211b19;padding:10px 12px;border-radius:9px;border:1px solid #ffffff14}
.cfgRow label{font-size:12px;font-weight:700;color:#ffd2b8;display:flex;justify-content:space-between}
.cfgRow input[type=range]{width:100%;accent-color:#e44332;height:24px;cursor:pointer}
.cfgGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfgGrid button,#tod button{min-width:0;padding:9px 10px;font-size:12px}
#tod{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}

/* Tela de Início limpa */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at center,#0005 0%,#090606cc 100%);text-align:center;padding:20px;z-index:100}
#menu h1{font-size:48px;margin:0;color:#e44332;letter-spacing:5px;text-shadow:0 0 24px #c0392b,0 4px 0 #3a0808;animation:fk 4s infinite}
@keyframes fk{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:.92}98%{opacity:.45}}
#best{margin:0;font-size:13px;font-weight:700;color:#ffd27d;letter-spacing:1px;text-shadow:0 2px 4px #000}
.menuBtns{display:flex;flex-direction:column;gap:10px;width:230px;margin-top:6px}
.menuBtns button{width:100%;padding:14px 20px;font-size:15px;letter-spacing:1.5px;background:linear-gradient(#6e1e17ee,#2a0b08ee);box-shadow:0 4px 18px #c0392b66}

#x{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:1.5px solid #fffd;border-radius:50%;pointer-events:none;z-index:5;box-shadow:0 0 4px #000;display:none}
#fl{position:fixed;inset:0;background:#f003;opacity:0;pointer-events:none;z-index:20}

/* Botões touch durante o jogo */
.t{position:fixed;display:none;width:64px;height:64px;min-width:0;padding:0;border-radius:50%;font-size:25px;line-height:1;right:14px;z-index:15;align-items:center;justify-content:center;background:#000c;box-shadow:0 0 12px #000a;touch-action:manipulation}
#bf{bottom:calc(94px + env(safe-area-inset-bottom,0px));font-size:28px;border-color:#ff4d3a}
#bj{bottom:calc(170px + env(safe-area-inset-bottom,0px))}
#bd{bottom:calc(246px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:21px}
#bw{bottom:calc(308px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:20px}
#bs{bottom:calc(370px + env(safe-area-inset-bottom,0px));width:52px;height:52px;font-size:20px}
.t2{position:fixed;top:calc(168px + env(safe-area-inset-top,0px));width:46px;height:46px;border-radius:50%;font-size:19px;line-height:1;min-width:0;padding:0;display:none;z-index:15;align-items:center;justify-content:center;background:#000c;touch-action:manipulation}
.t:active,.t2:active{transform:scale(.9);background:#c0392b88}

/* Inventário estilo TWZ2 / Last Day on Earth */
#invPanel{position:fixed;inset:0;display:none;background:var(--panel);flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;overflow:auto;padding:18px 14px 28px;z-index:90}
.invHeader{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;max-width:860px;width:100%;border-bottom:1px solid #ffffff1c;padding-bottom:8px;padding-right:54px;box-sizing:border-box}
.invHeader h2{margin:0;color:#ff6b57;font-size:22px;letter-spacing:1px}
.invStats{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:700}
.statPill{background:#0009;border:1px solid #ffffff24;padding:4px 9px;border-radius:6px}
.invTabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:860px;width:100%}
.invTab{min-width:0;padding:7px 14px;font-size:12px;border-radius:7px;border:1.5px solid #5c4538;background:#1c1614}
.invTab.active{background:#8f2419;border-color:#ff725e;color:#fff}
.invBody{display:grid;grid-template-columns:220px 1fr;gap:12px;max-width:860px;width:100%;align-items:start}
@media(max-width:680px){.invBody{grid-template-columns:1fr}}
.equipBox{background:#191412;border:2px solid #574236;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.equipTitle{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#e6b87d;border-bottom:1px solid #ffffff14;padding-bottom:4px}
.equipCard{background:#241c18;border:2px solid #785a48;border-radius:8px;padding:8px;display:flex;align-items:center;gap:8px}
.equipCard img{width:46px;height:46px;object-fit:contain;background:#120e0c;border-radius:6px;padding:3px}
#invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px;width:100%}
.invSlot{background:var(--slot);border:2px solid var(--slot-b);border-radius:9px;padding:8px 6px;text-align:center;font-size:11px;min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:4px;position:relative;box-shadow:inset 0 0 12px #0006}
.invSlot img{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 3px #000)}
.invSlot .name{font-weight:700;line-height:1.15;font-size:11px}
.invSlot .qty{font-size:10px;opacity:.92;color:#ddd}
.invSlot .actBtn{margin-top:2px;padding:5px 8px;font-size:10px;min-width:0;width:90%;border-radius:6px;border-width:1.5px}
.badgeTop{position:absolute;top:4px;left:5px;font-size:9px;font-weight:800;padding:1px 5px;border-radius:4px;background:#0009}
#invClose{min-width:160px;margin-top:6px}
#msg{position:fixed;top:22%;width:100%;text-align:center;font:700 19px system-ui;text-shadow:0 2px 6px #000;pointer-events:none;opacity:0;z-index:50;transition:opacity .2s}

/* Luneta de Sniper / DMR */
#sc{position:fixed;inset:0;display:none;pointer-events:none;z-index:4;background:radial-gradient(circle at center,transparent 27%,rgba(0,0,0,.72) 27.6%,rgba(0,0,0,.97) 36%,#000 100%)}
#scRing{position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:min(56vh,56vw);transform:translate(-50%,-50%);border-radius:50%;border:2.5px solid rgba(255,255,255,.35);box-shadow:0 0 0 9999px rgba(0,0,0,.65),inset 0 0 28px rgba(0,0,0,.85)}
#scH{position:fixed;left:50%;top:50%;width:min(56vh,56vw);height:1.5px;background:rgba(255,60,60,.75);transform:translate(-50%,-50%)}
#scV{position:fixed;left:50%;top:50%;width:1.5px;height:min(56vh,56vw);background:rgba(255,60,60,.75);transform:translate(-50%,-50%)}
#scCenterDot{position:fixed;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#ff2e2e;box-shadow:0 0 6px #ff2e2e;transform:translate(-50%,-50%)}
.mil-h{position:fixed;top:50%;width:1.5px;height:8px;background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
.mil-v{position:fixed;left:50%;width:8px;height:1.5px;background:rgba(255,255,255,.75);transform:translate(-50%,-50%)}
#scInfo{position:fixed;left:50%;bottom:calc(16% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font:700 11px system-ui;letter-spacing:2px;color:#ff9988;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<!-- Botão de Configurações no canto superior direito -->
<button id="cfgBtn" title="Configurações">⚙️</button>

<!-- Painel de Configurações -->
<div id="cfgPanel">
  <div class="cfgBox">
    <h2>⚙️ CONFIGURAÇÕES</h2>
    <div class="cfgRow">
      <label><span>🎯 Sensibilidade de Giro</span><span id="sensVal">1.0x</span></label>
      <input type="range" id="sensRange" min="0.2" max="2.5" step="0.1" value="1.0">
    </div>
    <div class="cfgRow">
      <label><span>☀️ Horário do Dia</span></label>
      <div id="tod">
        <button data-h="8">☀ MANHÃ</button>
        <button data-h="16">🌇 TARDE</button>
        <button data-h="22">🌙 NOITE</button>
      </div>
    </div>
    <div class="cfgRow">
      <label><span>🖥️ Gráficos & Desempenho</span></label>
      <div class="cfgGrid">
        <button id="rtxBtn" style="border-color:#ffb703">✨ RTX: LIGADO</button>
        <button id="pot">⚙ BATATA: OFF</button>
        <button id="sr"></button>
        <button id="sf"></button>
        <button id="sp"></button>
        <button id="sd"></button>
      </div>
    </div>
    <button id="fs" style="width:100%">⛶ TELA CHEIA</button>
    <button id="cfgClose" style="width:100%;background:#5e1b15">CONCLUÍDO</button>
  </div>
</div>

<!-- Tela de Início Limpa -->
<div id="menu">
  <h1>Z-PARKOUR</h1>
  <p id="best"></p>
  <div class="menuBtns">
    <button id="cont">CONTINUAR</button>
    <button id="new">▶ NOVO JOGO</button>
  </div>
</div>

<div id="hud">
  <div id="zoneBadge">🏙️ CENTRO DENSO (BECOS & TELHADOS)</div>
  <div class="bar"><i id="hp" style="background:#e33"></i></div>
  <div class="bar"><i id="fd" style="background:#e90"></i></div>
  <div class="bar"><i id="wt" style="background:#39e"></i></div>
  <div class="bar" style="height:6px"><i id="stBar" style="background:#4e8;width:100%"></i></div>
  <div id="inf"></div>
  <div id="inv" style="font-size:11px;margin-top:2px;opacity:.92"></div>
  <div id="quickSlots">
    <div class="qSlot" id="qFood" title="Usar Comida"><small>1</small><span id="qFoodQty">0</span></div>
    <div class="qSlot" id="qWater" title="Usar Água"><small>2</small><span id="qWaterQty">0</span></div>
    <div class="qSlot" id="qGrenade" title="Granada [G]"><small>G</small><span id="qGrQty">0</span></div>
    <div class="qSlot" id="qBomb" title="Bomba [H]"><small>H</small><span id="qBbQty">0</span></div>
  </div>
</div>
<div id="x"></div>
<div id="msg"></div>

<div id="sc">
  <div id="scRing"></div>
  <div id="scH"></div>
  <div id="scV"></div>
  <div id="scCenterDot"></div>
  <div class="mil-h" style="left:calc(50% - 90px)"></div>
  <div class="mil-h" style="left:calc(50% - 60px)"></div>
  <div class="mil-h" style="left:calc(50% - 30px)"></div>
  <div class="mil-h" style="left:calc(50% + 30px)"></div>
  <div class="mil-h" style="left:calc(50% + 60px)"></div>
  <div class="mil-h" style="left:calc(50% + 90px)"></div>
  <div class="mil-v" style="top:calc(50% - 90px)"></div>
  <div class="mil-v" style="top:calc(50% - 60px)"></div>
  <div class="mil-v" style="top:calc(50% - 30px)"></div>
  <div class="mil-v" style="top:calc(50% + 30px)"></div>
  <div class="mil-v" style="top:calc(50% + 60px)"></div>
  <div class="mil-v" style="top:calc(50% + 90px)"></div>
  <div id="scInfo">LUNETA ÓPTICA · ZOOM ATIVO</div>
</div>

<div id="cr" style="position:fixed;inset:0;display:none;background:#000d;flex-direction:column;align-items:center;justify-content:center;gap:8px;overflow:auto;padding:12px;z-index:90"></div>

<div id="invPanel">
  <div class="invHeader">
    <h2>🎒 INVENTÁRIO & ARSENAL</h2>
    <div class="invStats" id="invTopStats"></div>
  </div>
  <div class="invTabs">
    <button class="invTab active" data-tab="all">Tudo</button>
    <button class="invTab" data-tab="weapons">Armas (40)</button>
    <button class="invTab" data-tab="consumables">Consumíveis & Explosivos</button>
    <button class="invTab" data-tab="materials">Sucata & Materiais</button>
  </div>
  <div class="invBody">
    <div class="equipBox">
      <div class="equipTitle">Equipado Agora</div>
      <div class="equipCard" id="invEquipped"></div>
      <div class="equipTitle">Sobrevivência</div>
      <div id="invSurvivalList" style="font-size:12px;display:flex;flex-direction:column;gap:6px"></div>
    </div>
    <div id="invGrid"></div>
  </div>
  <button id="invClose">FECHAR INVENTÁRIO</button>
</div>

<div style="position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,transparent 55%,#0008 100%);z-index:3"></div>
<div id="bbar" style="position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:25%;width:50%;height:12px;background:#0008;display:none;border:1px solid #fff6;z-index:10"><i id="bbi" style="display:block;height:100%;background:#a0f"></i></div>
<div id="fl"></div>

<button class="t" id="bf" title="Atirar">🔥</button>
<button class="t" id="bj" title="Pular">⏫</button>
<button class="t" id="bd" title="Dash">⚡</button>
<button class="t" id="bw" title="Trocar Arma">🔄</button>
<button class="t" id="bs" title="Deslizar">🛝</button>
<button class="t2" id="bg" style="left:10px" title="Granada">💣</button>
<button class="t2" id="bb" style="left:62px" title="Bomba">🧨</button>
<button class="t2" id="ba" style="left:114px" title="Mirar">🎯</button>
<button class="t2" id="bc" style="left:166px" title="Craft">🛠️</button>
<button class="t2" id="br" style="left:218px" title="Recarregar">🔃</button>
<button class="t2" id="bi" style="left:270px" title="Inventário">🎒</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,$=id=>document.getElementById(id),R=Math.random,SK='zp3d_v10_ui_fix',MAP=360;
const memStore={};
function readStore(k){try{return localStorage.getItem(k)}catch(e){return memStore[k]||null}}
function writeStore(k,v){try{localStorage.setItem(k,v)}catch(e){memStore[k]=String(v)}}

function onTap(el,fn){
  if(!el)return;
  el.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    fn(e);
  });
}

// ============== RARIDADES ==============
const RARITY={
  common:{label:'Comum',color:'#b8bcc2',weight:42},
  uncommon:{label:'Incomum',color:'#4cd964',weight:28},
  rare:{label:'Rara',color:'#4ea8ff',weight:16},
  epic:{label:'Épica',color:'#c06cff',weight:9},
  legendary:{label:'Lendária',color:'#ffb703',weight:5}
};

// ============== TEXTURAS ==============
function tex(w,h,fn,rx=1,ry=1){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  fn(c.getContext('2d'),w,h);
  const t=new T.CanvasTexture(c);
  t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;t.repeat.set(rx,ry);return t;
}
function spk(x,w,h,n,cols){
  for(let i=0;i<n;i++){x.globalAlpha=.15+R()*.35;x.fillStyle=cols[i%cols.length];x.fillRect(R()*w,R()*h,1+R()*4,1+R()*4)}
  x.globalAlpha=1;
}

const tG=tex(256,256,(x,w,h)=>{
  x.fillStyle='#3b3934';x.fillRect(0,0,w,h);
  x.strokeStyle='#262420';x.lineWidth=2;
  for(let i=0;i<=w;i+=32){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke()}
  spk(x,w,h,3200,['#22201c','#524f47','#2f2d28','#181612','#635e54']);
},130,130);

const tR=tex(512,128,(x,w,h)=>{
  x.fillStyle='#6c6962';x.fillRect(0,0,w,16);x.fillRect(0,h-16,w,16);
  x.fillStyle='#8c887e';x.fillRect(0,14,w,4);x.fillRect(0,h-18,w,4);
  x.fillStyle='#2a2926';x.fillRect(0,18,w,2);x.fillRect(0,h-20,w,2);
  x.fillStyle='#1f2126';x.fillRect(0,20,w,h-40);
  spk(x,w,h,4200,['#121317','#353840','#282a30','#18191d']);
  x.fillStyle='rgba(70,95,120,0.22)';
  x.beginPath();x.ellipse(140,48,38,10,0.1,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(390,82,45,11,-0.08,0,Math.PI*2);x.fill();
  x.strokeStyle='#111215';x.lineWidth=1.5;
  x.beginPath();x.moveTo(60,30);x.lineTo(85,48);x.lineTo(75,65);x.stroke();
  x.beginPath();x.moveTo(290,95);x.lineTo(315,78);x.lineTo(340,86);x.stroke();
  x.fillStyle='#b8bcc2';x.fillRect(0,23,w,2);x.fillRect(0,h-25,w,2);
  x.fillStyle='#d8ae28';
  for(let i=0;i<8;i++){x.fillRect(i*64+10,61,34,2.5);x.fillRect(i*64+10,65,34,2.5)}
  x.fillStyle='#34383e';x.beginPath();x.arc(220,42,7,0,Math.PI*2);x.fill();
  x.strokeStyle='#191b1f';x.lineWidth=1.5;x.stroke();
},52,1);

const tCrosswalk=tex(128,128,(x,w,h)=>{
  x.fillStyle='#1f2126';x.fillRect(0,0,w,h);
  spk(x,w,h,900,['#121317','#32353d']);
  x.fillStyle='#d6d8dc';
  for(let i=8;i<w-8;i+=22)x.fillRect(i,16,12,h-32);
},1,1);

const tC=tex(128,128,(x,w,h)=>{
  x.fillStyle='#754920';x.fillRect(0,0,w,h);
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#633b17':'#855629';x.fillRect(0,i*16,w,15)}
  x.strokeStyle='#42260c';x.lineWidth=6;x.strokeRect(3,3,w-6,h-6);
},1,1);

const tRoof=tex(128,128,(x,w,h)=>{
  x.fillStyle='#36393e';x.fillRect(0,0,w,h);
  x.strokeStyle='#232529';x.lineWidth=2;
  for(let i=0;i<=w;i+=16){x.beginPath();x.moveTo(i,0);x.lineTo(i,h);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(w,i);x.stroke()}
  spk(x,w,h,900,['#1e2024','#4a4f57','#2b2e33']);
},4,4);

const mkB=(base,win,style)=>tex(256,256,(x,w,h)=>{

const iconDataCache={};
function drawTwzIcon(kind,opts={}){
  const key=kind+'_'+(opts.idx||'')+'_'+(opts.color||'');
  if(iconDataCache[key])return iconDataCache[key];
  const c=document.createElement('canvas');c.width=96;c.height=96;
  const x=c.getContext('2d');
  x.clearRect(0,0,96,96);

  x.fillStyle='rgba(0,0,0,0.42)';
  x.beginPath();x.ellipse(48,78,30,8,0,0,Math.PI*2);x.fill();

  const outline=(lw=4)=>{x.lineJoin='round';x.lineCap='round';x.strokeStyle='#0d0b0a';x.lineWidth=lw};

  if(kind==='gun'||kind==='scope'||kind==='melee'){
    x.save();
    x.translate(48,50);
    x.rotate(-0.34);
    const acc=opts.color||'#78828c';
    if(kind==='melee'){
      x.fillStyle='#5c3419';outline(4);
      x.beginPath();x.roundRect(-34,-5,22,10,3);x.fill();x.stroke();
      x.fillStyle='#c9a23b';
      x.fillRect(-13,-12,6,24);x.strokeRect(-13,-12,6,24);
      x.fillStyle='#dce4ec';
      x.beginPath();x.moveTo(-7,-8);x.lineTo(36,-4);x.lineTo(40,1);x.lineTo(-7,7);x.closePath();
      x.fill();x.stroke();
      x.fillStyle='#ffffff99';x.fillRect(-2,-4,34,2);
    }else{
      const heavy=opts.heavy;
      x.fillStyle='#3a2618';outline(4);
      x.beginPath();x.moveTo(-38,-9);x.lineTo(-14,-6);x.lineTo(-14,8);x.lineTo(-38,12);x.closePath();
      x.fill();x.stroke();
      x.fillStyle='#24282e';
      x.fillRect(-15,-9,28,15);x.strokeRect(-15,-9,28,15);
      x.fillStyle=acc;
      x.fillRect(13,-7,heavy?28:22,8);x.strokeRect(13,-7,heavy?28:22,8);
      x.fillStyle='#191c20';
      x.beginPath();x.moveTo(0,6);x.lineTo(10,6);x.lineTo(14,22);x.lineTo(4,22);x.closePath();
      x.fill();x.stroke();
      x.fillStyle='#1c1816';

        x.fillStyle='#2f343b';
        x.fillRect(-4,-13,10,4);x.strokeRect(-4,-13,10,4);
      }
      x.fillStyle='#ffffff44';x.fillRect(-13,-8,24,2);
    }
    x.restore();
  }else if(kind==='food'){
    outline(4);
    x.fillStyle='#9e3022';
    x.beginPath();x.ellipse(48,50,26,18,-0.15,0,Math.PI*2);x.fill();x.stroke();
    x.fillStyle='#f3d9c8';
    x.beginPath();x.ellipse(42,46,12,7,-0.15,0,Math.PI*2);x.fill();x.stroke();
    x.fillStyle='#c44935';
    x.beginPath();x.ellipse(42,46,6,3.5,-0.15,0,Math.PI*2);x.fill();
  }else if(kind==='water'){
    outline(4);
    x.fillStyle='#2b88d9';
    x.beginPath();x.roundRect(30,24,36,48,10);x.fill();x.stroke();
    x.fillStyle='#1e2933';
    x.fillRect(38,14,20,11);x.strokeRect(38,14,20,11);
    x.fillStyle='#8fd8ff';
    x.fillRect(36,32,6,30);
  }else if(kind==='ammo'){
    outline(4);
    x.fillStyle='#4b632d';
    x.beginPath();x.roundRect(22,30,52,42,6);x.fill();x.stroke();
    x.fillStyle='#637d3d';
    x.fillRect(20,26,56,10);x.strokeRect(20,26,56,10);
    x.fillStyle='#f2c94c';
    x.font='900 13px system-ui';x.textAlign='center';

    x.fillStyle='#4f6b2f';
    x.beginPath();x.arc(48,54,21,0,Math.PI*2);x.fill();x.stroke();
    x.fillStyle='#78828c';
    x.fillRect(42,26,12,10);x.strokeRect(42,26,12,10);
    x.strokeStyle='#e0e6ed';x.lineWidth=2.5;
    x.beginPath();x.arc(58,32,8,0.4,Math.PI*1.3);x.stroke();

    x.beginPath();x.ellipse(68,49,6,14,0,0,Math.PI*2);x.fill();x.stroke();
  }else if(kind==='g'){
    outline(4);
    x.fillStyle='#3b4048';
    x.beginPath();x.ellipse(48,58,26,14,0,0,Math.PI*2);x.fill();x.stroke();
    x.fillStyle='#f59e0b';
    x.beginPath();x.arc(48,40,7,0,Math.PI*2);x.fill();x.stroke();
  }

  const url=c.toDataURL();
  iconDataCache[key]=url;
  return url;
}

function getWeaponIcon(idx){
  const w=WP[idx];
  const rc=RARITY[w.rarity]||RARITY.common;
  const kind=w.melee?'melee':(w.scope?'scope':'gun');
  const heavy=idx===9||idx===24||idx===35||idx===39;
  return drawTwzIcon(kind,{idx,color:rc.color,heavy});
}

const sharedBoxMat=new Map();
function getBoxMat(map,rx,ry,rough=0.72,metal=0.12){
  const key=map.uuid+'_'+rx+'_'+ry+'_'+rough+'_'+metal;
  if(sharedBoxMat.has(key))return sharedBoxMat.get(key);
  const m=map.clone();m.needsUpdate=true;m.repeat.set(rx,ry);
  const mat=new T.MeshStandardMaterial({map:m,roughness:rough,metalness:metal});
  sharedBoxMat.set(key,mat);
  return mat;
}

gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;scene.add(gr);

const boxes=[];
function addBox(x,z,w,d,h,map,rep,y0=0,castSh=true){
  const rx=rep?Math.max(1,Math.round(Math.max(w,d)/5)):1;
  const ry=rep?Math.max(1,Math.round(h/5)):1;
  const mat=getBoxMat(map,rx,ry,0.74,0.14);
  const me=new T.Mesh(new T.BoxGeometry(w,h,d),mat);
  me.position.set(x,y0+h/2,z);
  me.castShadow=castSh&&!potato;me.receiveShadow=!potato;
  scene.add(me);
  boxes.push({x0:x-w/2,x1:x+w/2,z0:z-d/2,z1:z+d/2,top:y0+h,bot:y0,me,cx:x,cz:z});
  return me;
}

const blk=(x,z,y,r)=>boxes.find(b=>x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r&&y<b.top-.35&&y+1.8>b.bot);
const blocked=(x,z,y,r)=>boxes.some(b=>x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r&&y<b.top-.35&&y+1.8>b.bot);
const groundAt=(x,z,y,r)=>{let g=0;for(const b of boxes)if(x>b.x0-r&&x<b.x1+r&&z>b.z0-r&&z<b.z1+r&&y>=b.top-.35&&b.top>g)g=b.top;return g};

const trimM=new T.MeshStandardMaterial({color:0x8a8780,roughness:0.65,metalness:0.2}),awnM=new T.MeshStandardMaterial({color:0x8a2a2a,roughness:0.75}),acM=new T.MeshStandardMaterial({color:0x777b80,roughness:0.45,metalness:0.55});

// ============== PRÉDIOS 3D DETALHADOS ==============
function addBuilding3D(cx,cz,w,d,h,m){
  const wallT=0.65;
  addBox(cx,cz,w,d,h,m,1,0);
  D(cx,cz,w+0.8,d+0.8,0.45,h-0.25,trimM);
  addBox(cx,cz,w+0.4,d+0.4,0.35,tRoof,1,h+0.2);
  const topY=h+0.55;
  addBox(cx,cz-d/2+0.1,w+0.4,wallT,0.95,m,1,topY);
  addBox(cx,cz+d/2-0.1,w+0.4,wallT,0.95,m,1,topY);
  addBox(cx-w/2+0.1,cz,wallT,d-0.6,0.95,m,1,topY);
  addBox(cx+w/2-0.1,cz,wallT,d-0.6,0.95,m,1,topY);
  D(cx-(w*0.18),cz-(d*0.12),Math.min(5.5,w*0.36),Math.min(4.5,d*0.36),2.4,topY,trimM);
  D(cx+(w*0.22),cz+(d*0.15),1.7,1.4,1.3,topY,acM);
  addBox(cx+(w*0.22),cz-(d*0.2),2.2,2.2,1.1,tC,0,topY);
  return topY+0.95;
}

function house(cx,cz,w,d,m,TH){
  const H=TH||3.4,t=.55,ds=0|R()*4,g=3.2;
  if(TH){
    addBuilding3D(cx,cz,w,d,H,m);
    const side=R()<.5?1:-1;
    addBox(cx+side*(w/2+1.2),cz,2.4,Math.min(8,d*.6),0.4,tC,0,H*.55);
    for(let k=1;k<=4;k++){
      addBox(cx+side*(w/2+1.2),cz-d*.25+k*1.6,1.6,1.6,k*1.15,tC,0,0);
    }
  }else{
    const seg=(x,z,L,ax,door)=>{
      if(!door){ax?addBox(x,z,L,t,H,m,1):addBox(x,z,t,L,H,m,1);return}
      const a=(L-g)/2,o=g/2+a/2;
      if(ax){addBox(x-o,z,a,t,H,m,1);addBox(x+o,z,a,t,H,m,1);addBox(x,z,g,t,H-2.4,m,1,2.4)}
      else{addBox(x,z-o,t,a,H,m,1);addBox(x,z+o,t,a,H,m,1);addBox(x,z,t,g,H-2.4,m,1,2.4)}
    };
    seg(cx,cz-d/2,w,1,ds==0);seg(cx,cz+d/2,w,1,ds==1);seg(cx-w/2,cz,d,0,ds==2);seg(cx+w/2,cz,d,0,ds==3);
    addBox(cx,cz,w+t,d+t,.45,tRoof,1,H-.45);
    D(cx,cz,w+1,d+1,.25,H-.1,trimM);
    D(cx+(R()-.5)*(w-4),cz+(R()-.5)*(d-4),1.4,1.1,1.0,H,acM);
    const sx=ds==3?-1:1,bx=cx+sx*(w/2+1.3);
    addBox(bx,cz+d/2-4,1.6,1.6,1,tC,0);
    addBox(bx,cz+d/2-2.3,1.6,1.6,2.1,tC,0);
  }
  const f=new T.Mesh(new T.PlaneGeometry(w,d),mFl);f.rotation.x=-Math.PI/2;f.position.set(cx,.03,cz);scene.add(f);
  for(let k=0;k<3;k++)addBox(cx+(R()-.5)*(w-4),cz+(R()-.5)*(d-4),1.5,.8,.8,tC,0);
  const lootCount=TH?6:4;
  for(let k=0;k<lootCount;k++)LOOT.push([cx+(R()-.5)*(w-3),cz+(R()-.5)*(d-3),'fdaarrw'[0|R()*7]]);
  if(R()<.6)addLootCrate(cx+(R()-.5)*(w-4),cz+(R()-.5)*(d-4));
  if(nl<6&&R()<.45){nl++;const L=new T.PointLight(0xffb470,1.2,18);L.position.set(cx,2.4,cz);scene.add(L)}
}

function market(cx,cz){

const lootBoxMat=new T.MeshStandardMaterial({map:tLoot,roughness:0.65});
function addLootCrate(x,z){
  const g=new T.Group();
  const box=new T.Mesh(new T.BoxGeometry(1.4,1.1,1.4),lootBoxMat);
  box.position.y=.55;g.add(box);
  const lid=new T.Mesh(new T.BoxGeometry(1.42,.12,1.42),lootBoxMat);
  lid.position.set(0,1.15,.15);lid.rotation.x=-.25;g.add(lid);

function makeFoodMesh(type){
  const g=new T.Group();
  if(type==='f'){
    const meat=new T.Mesh(new T.BoxGeometry(.45,.25,.3),new T.MeshStandardMaterial({color:0x9e3022,roughness:0.6}));meat.position.y=.15;g.add(meat);

  }else if(type==='a'){
    const box=new T.Mesh(new T.BoxGeometry(.5,.3,.35),new T.MeshStandardMaterial({color:0x4b632d,roughness:0.5,metalness:0.35}));box.position.y=.18;g.add(box);

const ICT={};
function ico(urlKey,url){
  if(!ICT[urlKey])ICT[urlKey]=new T.TextureLoader().load(url);
  const s=new T.Sprite(new T.SpriteMaterial({map:ICT[urlKey],depthWrite:false}));
  s.scale.set(.95,.95,1);
  return s;
}

function wmesh(i,sc){
  const g=new T.Group();
  for(const a of GM[i]){const m=new T.Mesh(GG(a),a[6]);m.position.set(a[3],a[4],a[5]);if(a[8])m.rotation.x=a[8];if(a[9])m.rotation.z=a[9];g.add(m)}
  g.scale.setScalar(sc);return g;
}

let pk=[];
function spawnLoot(){
  const add=(x,z,t)=>{
    if(blocked(x,z,0,.45))return;
    const g=new T.Group(),wi=pickWeightedWeapon();
    g.position.set(x,0,z);
    let iconUrl=drawTwzIcon(t==='r'?'m':t);
    if(t==='w'){
      const w=wmesh(wi,1.5);w.position.y=.4;w.rotation.z=.25;g.add(w);
      iconUrl=getWeaponIcon(wi);
    }else g.add(makeFoodMesh(t));
    const s=ico(t==='w'?('w_'+wi):t,iconUrl);s.position.y=1.25;g.add(s);
    scene.add(g);pk.push({x,z,m:g,t,wi});
  };
  for(const l of LOOT)add(l[0],l[1],l[2]);
  for(let k=0;k<90;k++){const c=rdp();add(c.x,c.z,'r')}
}

function reset(s){
  const N=WP.length;
  zs.forEach(z=>scene.remove(z));zs=[];pk.forEach(k=>scene.remove(k.m));pk=[];spawnLoot();
  p={x:0,y:0,z:0,vy:0,yaw:0,pit:0,hp:s?s.hp:100,w:s&&s.w<N?s.w:0,cd:0,food:s&&s.food!=null?s.food:80,water:s&&s.water!=null?s.water:80};
  const defA=WP.map(w=>w.melee?1:w.am*2),defMg=WP.map(w=>w.mg),defOwn=WP.map((_,i)=>i===0||i===4||i===10?1:0);
  const ok=s&&s.A&&s.A.length==N&&s.own&&s.own.length==N&&s.mg&&s.mg.length==N;
  A=ok?s.A:defA;mg=ok?s.mg:defMg;own=ok?s.own:defOwn;
  inv=s&&s.inv?s.inv:{m:6,w:4,c:3,g:4,gr:2,bb:1,food:1,water:1};
  hordeT=60;bossW=0;hg=null;kills=s?s.kills:0;score=s?s.score:0;combo=0;over=0;wasAir=0;dblJump=1;dashT=0;dashCd=0;stamina=100;aim=0;fire=0;setGun();
  for(let i=0;i<10;i++)spawn();
}

function spawn(a0){
  const wave=1+Math.floor(kills/12),a=a0==null?R()*6.28:a0+(R()-.5)*.5,d=16+R()*15;
  const x=p.x+Math.cos(a)*d,z=p.z+Math.sin(a)*d;
  if(Math.abs(x)>MAP-5||Math.abs(z)>MAP-5||blocked(x,z,0,.6))return;
  const rr=R();let ty=0;
  if(wave>1){if(rr<.12)ty=1;else if(rr<.22)ty=2;else if(rr<.4)ty=3;else if(rr<.45&&wave>2)ty=4}
  mkZ(x,z,(3+wave*.4)*[1,.8,.6,.5,6][ty],(2.2+R()*1.6+wave*.15)*[1,.7,1,1.8,.6][ty],ty);
}

  keys[e.code]=1;
  if(e.code=='Space'){e.preventDefault();jump()}
  if(e.code=='KeyE')dash();

  if(e.code=='KeyC'||e.code=='ControlLeft')slide();

  if(e.code=='KeyB')toggleCr();

    if(!st[s])st[s]={id:t.identifier,ox:t.clientX,oy:t.clientY,lx:t.clientX,ly:t.clientY,dx:0,dy:0};
  }
},{passive:true});

  if(menuOn||invOn||crOn||cfgOn)return;
  e.preventDefault();
  const mult=S.sens||1.0;
  for(const t of e.changedTouches){
    const l=st.l,r=st.r;

      let dx=t.clientX-l.ox,dy=t.clientY-l.oy;
      const m=Math.hypot(dx,dy);if(m>50){dx*=50/m;dy*=50/m}

      const sens=(aim&&WP[p.w].scope?.0022:.005)*mult;
      p.yaw-=(t.clientX-r.lx)*sens;
      p.pit=Math.max(-1.4,Math.min(1.4,p.pit-(t.clientY-r.ly)*sens));
      r.lx=t.clientX;r.ly=t.clientY;
    }
  }
},{passive:false});

function jump(){
  if(menuOn||invOn||crOn||cfgOn)return;
  const g=groundAt(p.x,p.z,p.y,.4);
  if(p.vy===0&&g>=p.y-.02){p.vy=8.8;over=0;dblJump=1;snd(260,.08,'sine',.08,1.3)}
  else if(p.wa&&p.y>.3){
    p.vy=9.0;wr=1.8;over=1;dblJump=1;
    const push=(p.ws>0?-1:1)*4.5;
    const nx=p.x+Math.cos(p.yaw)*push*.15,nz=p.z-Math.sin(p.yaw)*push*.15;
    if(!blocked(nx,nz,p.y,.38)){p.x=nx;p.z=nz}
    snd(420,.12,'sine',.12,1.6);
  }else if(dblJump>0&&stamina>=20){
    dblJump=0;stamina-=20;p.vy=8.2;over=1;snd(480,.1,'triangle',.12,1.8);
  }
}

function got(t,wi){
  snd(600,.15,'sine',.2,2);
  if(t==='f'){inv.food=(inv.food||0)+1;p.food=Math.min(100,p.food+25);msg('+ Comida (inventário)')}
  else if(t==='d'){inv.water=(inv.water||0)+1;p.water=Math.min(100,p.water+25);msg('+ Água (inventário)')}
  else if(t==='r'){const k='mwcg'[0|R()*4];inv[k]+=1+(R()*2|0);msg('+ '+RN[k])}
  else if(t==='a'){
    const unlockedGuns=own.map((v,idx)=>v&&!WP[idx].melee?idx:-1).filter(x=>x>=0);
    const i=own[p.w]&&!WP[p.w].melee?p.w:(unlockedGuns[0|R()*unlockedGuns.length]??0);
    A[i]+=WP[i].am;msg('+ '+WP[i].am+'x '+WP[i].ammoName);
  }
  else if(t==='w'){
    const locked=WP.map((_,i)=>i).filter(i=>!own[i]&&i>0);
    if(locked.length){
      const cand=(wi&&!own[wi]&&wi>0)?wi:pickWeightedWeapon();
      const i=!own[cand]&&cand>0?cand:locked[0|R()*locked.length];
      const w=WP[i],rc=RARITY[w.rarity]||RARITY.common;
      own[i]=1;A[i]=w.melee?1:w.am*2;mg[i]=w.mg;
      msg(`✨ [${rc.label}] ${w.n}`);
    }else{
      const j=pickWeightedWeapon();
      if(!WP[j].melee){A[j]+=WP[j].am;msg('+ '+WP[j].am+'x '+WP[j].ammoName)}
      else{inv.m+=2;msg('+2 Sucata')}
    }
  }
}

const rc=new T.Raycaster();rc.far=115;
function shoot(){
  const w=WP[p.w];if(fcd>0||rl>0)return;
  if(w.melee){
    fcd=w.d;swingT=.18;playWeaponSfx(p.w,w);
    const dir=new T.Vector3();cam.getWorldDirection(dir);
    for(const z of zs){
      if(z.userData.dead)continue;
      const dx=z.position.x-p.x,dz=z.position.z-p.z,d=Math.hypot(dx,dz);
      if(d<=w.rng){
        const dot=(dx/Math.max(.01,d))*dir.x+(dz/Math.max(.01,d))*dir.z;
        if(dot>.35){
          z.userData.z.hp-=w.dmg;
          snd(180,.08,'sawtooth',.14,.5);
          if(z.userData.z.hp<=0&&!z.userData.dead){
            z.userData.dead=1;kills++;score+=15;
            if(R()<.35){const t=R()<.4?'a':R()<.5?'f':'r';dropAt(z.position.x,z.position.z,t)}
          }
        }
      }
    }
    return;
  }
  if(mg[p.w]<=0){reload();return}
  fcd=w.d;mg[p.w]--;playWeaponSfx(p.w,w);
  gun.position.z=-.44;gun.rotation.x=.08;mfl.intensity=rtxOn?4.2:2.8;$('fl').style.opacity=.45;
  const aliveZ=zs.filter(z=>!z.userData.dead);
  if(!aliveZ.length)return;
  const wallMeshes=BM||(BM=boxes.map(b=>b.me));
  for(let i=0;i<w.pel;i++){
    rc.setFromCamera({x:(R()-.5)*w.sp*10*(aim?.2:1),y:(R()-.5)*w.sp*10*(aim?.2:1)},cam);
    const h=rc.intersectObjects(aliveZ,true)[0];
    if(!h)continue;
    let o=h.object;while(o&&!o.userData.z)o=o.parent;
    if(!o||o.userData.dead)continue;
    const wl=rc.intersectObjects(wallMeshes,false)[0];
    if(wl&&wl.distance<h.distance)continue;
    o.userData.z.hp-=w.dmg*(h.object.userData.head?2.2:1);
    if(w.expl)boom(h.point.x,h.point.y,h.point.z,w.expl,w.dmg);
    snd(220,.08,'sawtooth',.12,.5);
    if(o.userData.z.hp<=0&&!o.userData.dead){
      o.userData.dead=1;kills++;score+=h.object.userData.head?25:10;
      if(R()<.35){const t=R()<.4?'a':R()<.5?'f':'r';dropAt(o.position.x,o.position.z,t)}
    }
  }
}

function step(dt){
  dashCd=Math.max(0,dashCd-dt);

  const sp=((keys.ShiftLeft||(st.l&&m>.9))?8.5:5.6)*(p.y>0?1.22:1)*(sl>0?1.65+sl:1)*(dashT>0?2.8:1)*(hg?0:1)*dt;
  const c=Math.cos(p.yaw),s=Math.sin(p.yaw);

  const bx=blk(p.x+dx,p.z,p.y,r),bz=blk(p.x,p.z+dz,p.y,r);
  if(!bx)p.x+=dx;if(!bz)p.z+=dz;
  const bb=bx||bz;

  if(bb&&p.vy>0&&mant<=0&&bb.top-p.y>.2&&bb.top-p.y<=1.8&&bb.top<=6.5){p.y=bb.top;p.vy=3.2;mant=.28;p.x+=dx*3;p.z+=dz*3;over=1;dblJump=1;snd(310,.1,'sine',.1,1.5)}
  else if(bb&&p.vy===0&&mant<=0&&bb.top-p.y>.35&&bb.top-p.y<=1.25&&m>.4){p.y=bb.top;p.vy=2.4;mant=.28;p.x+=dx*4;p.z+=dz*4;over=1;dblJump=1;snd(290,.08,'sine',.1,1.6)}
  else if(bb&&p.vy<0&&!hg&&mant<=0&&bb.top-p.y>.4&&bb.top-p.y<=2.1&&bb.top<=12&&m>.25){hg=bb;p.vy=0;p.hgt=0;dblJump=1;snd(250,.1,'sine',.1,.6)}
  else if(bb&&p.y>.3&&p.vy!==0&&bb.top-p.y>2.2&&wr<2.2&&m>.3){wr+=dt;p.wa=1;p.vy=Math.max(p.vy,1.6);p.ws=((bb.x0+bb.x1)/2-p.x)*c-((bb.z0+bb.z1)/2-p.z)*s}

  p.x=Math.max(-MAP+1,Math.min(MAP-1,p.x));p.z=Math.max(-MAP+1,Math.min(MAP-1,p.z));

    if((iz<-.3&&p.hgt>.35)||keys.Space){p.y=hg.top;p.vy=3.2;mant=.35;p.x-=Math.sin(p.yaw)*1.1;p.z-=Math.cos(p.yaw)*1.1;hg=null;snd(310,.1,'sine',.1,1.5)}
    else if(keys.KeyC||keys.ControlLeft)hg=null;
  }
  if(!hg){p.vy-=24*dt;p.y+=p.vy*dt}
  if(p.y>=1&&p.vy<0&&g>=.8)over=1;
  if(p.y<=g){if(wasAir&&g>.5&&over){combo++;score+=10*combo;snd(520,.15,'sine',.15,2)}else if(wasAir&&g<.5)combo=0;p.y=g;p.vy=0;wasAir=0;wr=0;dblJump=1}else wasAir=1;

  SP.x=p.x;SP.z=p.z;p.sk=Math.max(0,(p.sk||0)-dt);
  fx=fx.filter(f=>{f.t+=dt;const s=1+f.t*14;f.m.scale.set(s,s,s);f.m.material.opacity=Math.max(0,.8-f.t*1.6);if(f.t>.5){scene.remove(f.m);return 0}return 1});
  {const bw=1+Math.floor(kills/12);if(bw%3==0&&bossW!=bw){bossW=bw;spawnBoss()}}
  hr=(hr+dt/15)%24;sky();
  p.food-=dt*.32;p.water-=dt*.45;
  if(p.food<=0||p.water<=0)p.hp-=2*dt;else if(p.food>50&&p.water>50)p.hp=Math.min(100,p.hp+1.2*dt);
  hordeT-=dt;
  if(hordeT<=0){hordeT=85+R()*40;const ha=R()*6.28;for(let i=0;i<12+Math.floor(kills/12)*2;i++)spawn(ha);msg('HORDA!');snd(50,1.5,'sawtooth',.3,.5)}

  bm=bm.filter(b=>{
    b.t-=dt;b.vy-=20*dt;const m=b.m.position,nx=m.x+b.vx*dt,nz=m.z+b.vz*dt;
    if(blocked(nx,m.z,m.y,.15))b.vx*=-.4;else m.x=nx;

    if(b.t<=0){boom(m.x,m.y,m.z,b.r,b.dm);scene.remove(b.m);return 0}return 1;
  });

}

let cullTick=0;
function frame(t){
  if(S.fps&&t-pl<1000/S.fps-2){requestAnimationFrame(frame);return}
  const dt=Math.min(.05,(t-pl)/1000);pl=t;
  if(!menuOn&&!crOn&&!invOn&&!cfgOn)step(dt);

  const cw=WP[p.w],rc=RARITY[cw.rarity]||RARITY.common;
  const isMoving=(keys.KeyD?1:0)-(keys.KeyA?1:0)!==0||(keys.KeyS?1:0)-(keys.KeyW?1:0)!==0||!!st.l;
  const isScopeAim=aim&&cw.scope&&!menuOn&&!crOn&&!invOn&&!cfgOn;
  const swayX=isScopeAim?Math.sin(t*.0022)*.008*(isMoving?2.2:1):0;
  const swayY=isScopeAim?Math.cos(t*.0017)*.008*(isMoving?2.2:1):0;

  cam.position.set(p.x+(p.sk>0?(R()-.5)*p.sk:0),p.y+1.7-(sl>0?.8:0),p.z);
  cam.rotation.y=p.yaw+swayX;cam.rotation.x=p.pit+swayY;
  p.tl=(p.tl||0)+((p.wa?(p.ws>0?.25:-.25):0)-(p.tl||0))*.12;cam.rotation.z=p.tl;

  if((++cullTick&3)===0)updateBoxVisibility();

  {const bo=zs.find(z=>!z.userData.dead&&z.userData.z.ty>=5);$('bbar').style.display=(bo&&!menuOn)?'block':'none';if(bo)$('bbi').style.width=Math.max(0,bo.userData.z.hp/bo.userData.z.hm*100)+'%'}
  {
    const tf=aim?(cw.scope?(cw.zoom||16):52):(dashT>0?86:75);
    if(Math.abs(cam.fov-tf)>.1){cam.fov+=(tf-cam.fov)*.22;cam.updateProjectionMatrix()}
    $('sc').style.display=isScopeAim?'block':'none';
    if(!menuOn)$('x').style.display=isScopeAim?'none':'block';
    gun.visible=!isScopeAim&&!menuOn;
    if(isScopeAim)$('scInfo').textContent=`${cw.n.toUpperCase()} [${rc.label.toUpperCase()}] · ${cw.ammoName} (${mg[p.w]}/${A[p.w]})`;
  }

  $('hp').style.width=Math.max(0,p.hp)+'%';$('fd').style.width=Math.max(0,p.food)+'%';$('wt').style.width=Math.max(0,p.water)+'%';$('stBar').style.width=Math.max(0,stamina)+'%';
  $('qFoodQty').textContent=inv.food||0;$('qWaterQty').textContent=inv.water||0;$('qGrQty').textContent=inv.gr||0;$('qBbQty').textContent=inv.bb||0;
  const ammoStatus=cw.melee?'Corpo a corpo':`${cw.ammoName}: ${rl>0?'recarregando…':mg[p.w]+'/'+A[p.w]}`;
  $('inv').textContent=`Sucata ${inv.m||0} · Madeira ${inv.w||0} · Pano ${inv.c||0} · Pólvora ${inv.g||0}`;
  $('inf').innerHTML=`${cw.n} <span style="color:${rc.color}">[${rc.label}]</span> (${ammoStatus}) · Onda ${1+Math.floor(kills/12)} · ${0|hr}h · Pts ${score}${combo>1?' · Parkour x'+combo:''}`;
  if(menuOn){const a=t/9000;cam.position.set(Math.cos(a)*35,14,Math.sin(a)*35);cam.lookAt(0,4,0)}
  ren.render(scene,cam);
  requestAnimationFrame(frame);
}

function fs(){
  try{
    const e=document.documentElement;
    const req=e.requestFullscreen||e.webkitRequestFullscreen;
    if(req&&!document.fullscreenElement){
      const p=req.call(e);
      if(p&&p.catch)p.catch(()=>{});
    }
    const o=window.screen&&screen.orientation;
    if(o&&o.lock)o.lock('landscape').catch(()=>{});
  }catch(x){}
}
function start(s){
  if(matchMedia('(pointer:coarse)').matches)fs();
  if(s&&s.hr!=null)hr=s.hr;audio();if(AC&&AC.state=='suspended')AC.resume();
  reset(s);menuOn=0;$('menu').style.display='none';
  setHudVisible(true);
}
const sv=load();if(sv)best=sv.best||0;reset(null);menuOn=1;setHudVisible(false);
$('best').textContent=best?'RECORDE: '+best:'';
$('cont').style.display=sv&&sv.hp>0?'block':'none';
onTap($('cont'),()=>start(load()));
onTap($('new'),()=>start(null));
requestAnimationFrame(frame);applyS();
onTap($('fs'),fs);
onTap($('sr'),()=>{S.res=RS[(RS.indexOf(S.res)+1)%4];applyS()});
onTap($('sf'),()=>{S.fps=FS[(FS.indexOf(S.fps)+1)%4];applyS()});
onTap($('sp'),()=>{S.px=PS[(PS.indexOf(S.px)+1)%4];applyS()});
onTap($('sd'),()=>{S.rd=RDS[(RDS.indexOf(S.rd)+1)%4];applyS()});
if(readStore('zp3drtx')=='0')setRtx(0);
if(readStore('zp3dq')=='1')setQ(1);
</script>
